# 테마(컨셉)별 캐릭터 목록. 이름은 전체에서 겹치면 안 된다 (characters.name UNIQUE, 30자 이내).
# look은 conversation-service Concept.lookRule 형식을 그대로 따른다. 콘티 LLM이 같은 형식으로 외모를 쓰므로
# 설명 임베딩(pgvector)으로 비슷한 캐릭터를 찾을 때 가까워진다. description을 비우면 look을 쓴다.
# style/negative는 Concept.style()/negative()와 같다 (DAILY는 comic.style 기본값과 같은 문구).
themes:
  DAILY:
    style: "simple cartoon, thick outlines, flat colors, plain background"
    negative: ""
    characters:
      - {name: 지우, look: "young woman, long black hair, yellow hoodie"}
      - {name: 하린, look: "young woman, short brown bob, green cardigan"}
      - {name: 도윤, look: "young man, short black hair, navy sweater"}
      - {name: 준호, look: "young man, curly brown hair, red flannel shirt"}
  ANIMALS:
    style: "cute anthropomorphic animal characters, round shapes, pastel colors, simple background"
    negative: "human, person, realistic animal, insect, bug"
    characters:
      - {name: 토토, look: "rabbit, pink scarf"}
      - {name: 곰곰, look: "bear, green sweater"}
      - {name: 여울, look: "fox, yellow raincoat"}
      - {name: 판다랑, look: "panda, red bow tie"}
